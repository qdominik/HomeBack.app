name: PR67 ACL pinned PostgreSQL baseline

permissions:
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/pr67-acl-diagnostic.yml

jobs:
  baseline:
    name: ACL ${{ matrix.snapshot }} CLI ${{ matrix.cli }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        snapshot: [main, pr67]
        cli: [2.109.1, 2.120.0]
        include:
          - snapshot: main
            ref: 3bd65a4642867d2cb0e73536a9c2cef9baa054a1
          - snapshot: pr67
            ref: 910dda1f2cc474f6f7bc80f8437021da5cb035fa
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Change only the tested CLI version
        run: npm install --no-save --package-lock=false supabase@${{ matrix.cli }}
      - name: Record source and CLI
        run: |
          git rev-parse HEAD HEAD:supabase
          npx supabase --version
      - name: Pin identical PostgreSQL image in all four variants
        run: |
          mkdir -p supabase/.temp
          printf '%s\n' '17.11.0.004' > supabase/.temp/postgres-version
      - name: Start fresh runner database
        id: start
        run: npx supabase start
      - name: Record ACL and bootstrap evidence before tests
        run: |
          docker inspect supabase_db_Homeback.app --format '{{.Config.Image}}'
          docker exec supabase_db_Homeback.app psql -X -U postgres -d postgres -At -c 'select version();'
          docker exec supabase_db_Homeback.app psql -X -U postgres -d postgres -P pager=off -c "select p.oid::regprocedure,pg_get_userbyid(p.proowner) as owner,p.prosecdef,p.proacl,has_function_privilege('public',p.oid,'EXECUTE') as public_execute,has_function_privilege('anon',p.oid,'EXECUTE') as anon_execute,has_function_privilege('authenticated',p.oid,'EXECUTE') as authenticated_execute from pg_proc p where proname in ('get_room_location_dependency_summary','get_storage_location_l2_dependency_summary','get_storage_location_l3_dependency_summary') order by 1; select pg_get_userbyid(d.defaclrole) as owner,n.nspname,d.defaclobjtype,d.defaclacl from pg_default_acl d left join pg_namespace n on n.oid=d.defaclnamespace where n.nspname='public' order by 1,3; select rolname,rolinherit,rolsuper from pg_roles where rolname in ('anon','authenticated'); select pg_get_userbyid(member) as member,pg_get_userbyid(roleid) as parent,inherit_option,set_option from pg_auth_members where member in ('anon'::regrole,'authenticated'::regrole);"
      - name: Full pgTAP without retries
        run: npx supabase test db
      - name: Populated migration independently of pgTAP result
        id: migration
        if: always() && steps.start.outcome == 'success'
        run: node scripts/prepare-invitation-test-db.mjs
      - name: Concurrent transactions independently of pgTAP result
        if: always() && steps.migration.outcome == 'success'
        run: node scripts/test-invitation-concurrency.mjs
      - name: Stop disposable runner stack
        if: always()
        run: npx supabase stop --no-backup
