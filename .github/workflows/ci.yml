name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - preview/**
      - feature/**

jobs:
  app:
    name: App
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whitespace
        run: git diff --check

      - name: Run logic tests
        run: npm run test:logic

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build