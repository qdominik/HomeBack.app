name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - preview/**
      - feature/**

jobs:
  app:
    name: App
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Check environment contract
        run: npm run check:env -- --example

      - name: Check whitespace
        run: git diff --check

      - name: Run logic tests
        run: npm run test:logic

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start ephemeral Supabase
        run: npx supabase start

      - name: Run database tests
        run: npx supabase test db

      - name: Verify populated role migration in isolated database
        run: node scripts/prepare-invitation-test-db.mjs

      - name: Verify real concurrent invitation transactions (pgTAP)
        run: node scripts/test-invitation-concurrency.mjs

      - name: Capture Supabase status on failure
        if: failure()
        run: npx supabase status || true

      - name: Stop ephemeral Supabase
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: E2E (local)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start ephemeral Supabase
        run: npx supabase start

      - name: Export local public Supabase environment
        shell: bash
        run: |
          api_url=""
          public_key=""
          service_role_key=""
          while IFS='=' read -r key value; do
            value="${value%\"}"
            value="${value#\"}"
            case "$key" in
              API_URL) api_url="$value" ;;
              PUBLISHABLE_KEY) public_key="$value" ;;
              ANON_KEY) if [ -z "$public_key" ]; then public_key="$value"; fi ;;
              SERVICE_ROLE_KEY) service_role_key="$value" ;;
              SECRET_KEY) if [ -z "$service_role_key" ]; then service_role_key="$value"; fi ;;
            esac
          done < <(npx supabase status -o env)

          test -n "$api_url"
          test -n "$public_key"
          test -n "$service_role_key"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3001" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_DEV_ORIGIN=http://127.0.0.1:3001" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$public_key" >> "$GITHUB_ENV"
          echo "E2E_LOCAL_SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Verify invitations kill switch in browser
        env:
          E2E_PORT: "3002"
          HOUSEHOLD_INVITATIONS_ENABLED: "false"
        run: npm run test:e2e -- tests/e2e/roles-invites-disabled.spec.ts

      - name: Capture Supabase status on failure
        if: failure()
        run: |
          mkdir -p test-results
          npx supabase status > test-results/supabase-status.txt 2>&1 || true

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-local-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop ephemeral Supabase
        if: always()
        run: npx supabase stop --no-backup
